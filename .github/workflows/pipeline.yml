# MPIIGaze 다운로드·전처리 → 15-fold 병렬 학습 → 결과 요약·노트북 실행 → 결과 커밋
# 실행 시간 약 1시간 (fold별 병렬)
name: pipeline

on:
  workflow_dispatch:   # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy opencv-python-headless scipy
      - name: Cache preprocessed data
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            data/EyeBased/MPIIGaze/Label
            data/mpiigaze_eye.npz
            data/raw_stats.json
          key: mpiigaze-eye-${{ hashFiles('preprocess/**', 'reader.py', 'gaze/data.py') }}
      - name: Download and preprocess MPIIGaze
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m preprocess.mpii
          python -c "import json; from gaze.data import load_all, raw_frame_counts; load_all(); json.dump(raw_frame_counts('data/MPIIGaze'), open('data/raw_stats.json', 'w'))"
          rm -rf data/raw data/MPIIGaze
      - uses: actions/upload-artifact@v4
        with:
          name: eye-data
          path: |
            data/EyeBased/MPIIGaze/Label
            data/mpiigaze_eye.npz
            data/raw_stats.json
          retention-days: 3

  train:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        fold: [p00, p01, p02, p03, p04, p05, p06, p07, p08, p09, p10, p11, p12, p13, p14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy opencv-python-headless scipy
      - uses: actions/download-artifact@v4
        with:
          name: eye-data
          path: data
      - run: python train_lopo.py --folds ${{ matrix.fold }} --save-params results/params
      - uses: actions/upload-artifact@v4
        with:
          name: fold-${{ matrix.fold }}
          path: results
          retention-days: 7

  report:
    needs: train
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y fonts-nanum > /dev/null
          pip install numpy opencv-python-headless scipy matplotlib pandas nbconvert ipykernel
      - uses: actions/download-artifact@v4
        with:
          name: eye-data
          path: data
      - uses: actions/download-artifact@v4
        with:
          pattern: fold-*
          merge-multiple: true
          path: results
      - name: Summarize and execute notebooks
        run: |
          python train_lopo.py --summarize
          find results/params -name '*.pkl' ! -name 'p00.pkl' -delete   # 노트북이 쓰는 p00만 저장소에 남김
          jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=3600 eda.ipynb pipeline.ipynb
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results eda.ipynb pipeline.ipynb
          git commit -m "Add pipeline results and executed notebooks" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
